<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Expense Tracker VI</title>
    <script defer src="script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Internal stylesheet -->
    <style>
      @font-face {
        font-family: "Pricedown";
        src: url("assets/Pricedown%20Bl.otf") format("opentype");
        font-display: swap;
      }

      .theme {
        min-height: 100vh;
        margin: 0;
        color: #fff8ff;
        font-family: "Segoe UI", sans-serif;
        background-color: #17121d;
        background:
          linear-gradient(
            180deg,
            rgb(17 13 24 / 42%) 0%,
            rgb(18 13 25 / 75%) 56%,
            #17121d 100%
          ),
          url("https://cdn.mos.cms.futurecdn.net/wJRxvPHcaWuYdDMbqcckyG.jpg")
            center 35% / cover fixed;
      }

      .title {
        width: 100%;
        margin: 38px auto 42px;
        font-family: "Pricedown", sans-serif;
        color: #fffaff;
        font-size: clamp(2rem, 6.5vw, 4.25rem);
        font-weight: bold;
        line-height: 0.95;
        text-align: center;
        text-shadow:
          -3px -3px 0 #32183e,
          3px -3px 0 #32183e,
          -3px 3px 0 #32183e,
          3px 3px 0 #32183e,
          0 0 14px #ff42bd,
          0 0 30px rgb(255 117 91 / 72%);
        text-transform: uppercase;
      }

      .expense-card {
        width: min(560px, calc(100% - 32px));
        height: auto;
        margin: 24px auto;
        padding: 24px;
        border: 1px solid rgb(255 150 220 / 48%);
        border-radius: 20px;
        background: rgb(25 17 38 / 88%);
        box-shadow:
          0 12px 40px rgb(0 0 0 / 35%),
          0 0 22px rgb(255 66 189 / 16%);
        color: #fff8ff;
        flex-direction: column;
        align-items: stretch;
        display: flex;
        justify-content: center;
        backdrop-filter: blur(10px);
      }

      .expense-card h1,
      .expense-card h2 {
        color: #fff4fb;
      }

      .expense-card input,
      .expense-card select {
        box-sizing: border-box;
        background-color: #fffaff;
        color: #261b30;
      }

      .buttonadd {
        min-height: 44px;
        width: 95%;
        margin-left: 15px;
        margin-top: 10px;
        margin-bottom: 20px;
        border: 0;
        border-radius: 24px;
        background: linear-gradient(100deg, #ffae67, #ff54b7);
        color: #24132b;
        cursor: pointer;
        font-size: 16px;
        font-weight: 800;
        transition:
          transform 150ms ease,
          filter 150ms ease;
      }

      .buttonadd:hover {
        filter: brightness(1.1);
        transform: translateY(-3px);
      }

      .music-toggle {
        position: fixed;
        right: 18px;
        bottom: 18px;
        z-index: 10;
        padding: 10px 16px;
        border: 1px solid rgb(255 150 220 / 55%);
        border-radius: 24px;
        background: rgb(25 17 38 / 92%);
        color: #fff8ff;
        cursor: pointer;
        backdrop-filter: blur(10px);
      }

      .music-toggle:hover {
        background: #ff54b7;
        color: #24132b;
      }

      @media (max-width: 520px) {
        .title {
          margin: 32px auto;
          font-size: clamp(1.5rem, 8vw, 2.5rem);
        }

        .expense-card {
          padding: 20px 16px;
        }

        .buttonadd {
          width: 100%;
          margin-left: 0;
        }
      }
    </style>
  </head>

  <body class="theme">
    <h1 class="title">Expense Tracker</h1>
    <h1 class="title">VI</h1>
    <!-- Add expense section -->
    <section id="Expense">
      <div class="expense-card">
        <h1
          style="
            font-size: 24px;
            font-weight: bold;
            margin-left: 20px;
            margin-top: 20px;
            margin-bottom: 10px;
          "
        >
          Add Expense
        </h1>
        <h2 style="margin-left: 20px">Title</h2>
        <input
          type="text"
          id="expenseName"
          placeholder="Expense Name"
          class="border border-gray-300 rounded px-2 py-1 mb-2 w-full"
          style="
            margin: 10px auto;

            padding: 5px;
            width: 95%;
            border-radius: 5px;
            border: 1px solid #ccc;
          "
        />
        <h2 style="margin-left: 20px">Amount(₱)</h2>
        <input
          type="number"
          id="expenseAmount"
          placeholder="0.00"
          class="border border-gray-300 rounded px-2 py-1 mb-2 w-full"
          style="
            margin: 10px auto;

            padding: 5px;
            width: 95%;
            border-radius: 5px;
            border: 1px solid #ccc;
          "
        />
        <h2 style="margin-left: 20px">Category</h2>
        <select
          id="expenseCategory"
          name="category"
          style="
            margin: 10px auto;

            padding: 5px;
            width: 95%;
            border-radius: 5px;
            border: 1px solid #ccc;
          "
        >
          <option value="Food">Food</option>
          <option value="Commute">Commute</option>
          <option value="School" selected>School</option>
          <option value="Personal">Personal</option>
        </select>
        <button id="addExpenseButton" class="buttonadd">Add Expense +</button>
        <p id="error" style="color: red; margin: 0 20px 20px"></p>
      </div>
    </section>
    <!-- Filter by category section -->
    <section>
      <div class="expense-card">
        <h1
          style="
            font-size: 24px;
            font-weight: bold;
            margin-left: 20px;
            margin-top: 20px;
            margin-bottom: 10px;
          "
        >
          Filter by Category
        </h1>
        <select
          id="filterCategory"
          name="category"
          style="
            margin: 10px auto;

            padding: 5px;
            width: 95%;
            border-radius: 5px;
            border: 1px solid #ccc;
          "
        >
          <option value="All" selected>All</option>
          <option value="Food">Food</option>
          <option value="Commute">Commute</option>
          <option value="School">School</option>
          <option value="Personal">Personal</option>
        </select>
        <div id="expenseList" style="margin: 0 20px"></div>
      </div>
    </section>
    <!-- Summary of expenses section -->
    <section id="Summary">
      <div class="expense-card">
        <h2 style="font-size: 24px; font-weight: bold; margin: 20px 20px 10px">
          Summary of Expenses
        </h2>

        <p style="margin: 10px 20px 20px; font-weight: bold">
          Total: <span id="totalAmount">₱0.00</span>
        </p>
      </div>
    </section>
    <button
      class="music-toggle"
      id="musicToggle"
      type="button"
      aria-pressed="false"
    >
      ♫ Enable music
    </button>
    <audio
      id="backgroundMusic"
      src="assets/background-music.mp3"
      loop
      preload="none"
    ></audio>
  </body>
</html>
